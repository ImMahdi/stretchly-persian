<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title data-i18next="preferences.title"></title>
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src https://api.github.com">
  <meta http-equiv="X-Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src https://api.github.com">
  <link rel="stylesheet" type="text/css" href="css/normalize.css">
  <link rel="stylesheet" type="text/css" href="css/commons.css">
  <link rel="stylesheet" type="text/css" href="css/color-scheme.css">
  <link rel="stylesheet" type="text/css" href="css/preferences.css">
</head>

<body>
  <!-- Top Navigation Bar (4 Desktop Tabs) -->
  <nav class="navigation">
    <a href="#" class="active" data-section="settings">
      <div class="nav-item">
        <img src="images/preferences/settings.svg" alt="Settings">
        <span data-i18next="preferences.nav.settings"></span>
      </div>
    </a>
    <a href="#" data-section="schedule">
      <div class="nav-item">
        <img src="images/preferences/schedule.svg" alt="Schedule">
        <span data-i18next="preferences.nav.schedule"></span>
      </div>
    </a>
    <a href="#" data-section="ideas">
      <div class="nav-item">
        <img src="images/preferences/ideas.svg" alt="Ideas">
        <span data-i18next="preferences.nav.ideas"></span>
      </div>
    </a>
    <a href="#" data-section="theme">
      <div class="nav-item">
        <img src="images/preferences/theme.svg" alt="Theme">
        <span data-i18next="preferences.nav.theme"></span>
      </div>
    </a>
    <a href="#" data-section="about">
      <div class="nav-item">
        <img src="images/preferences/about.svg" alt="About">
        <span data-i18next="preferences.nav.about"></span>
      </div>
    </a>
  </nav>

  <main class="content-container">

    <!-- ==================== TAB 1: SETTINGS ==================== -->
    <div class="section-content settings">

      <!-- Startup Card -->
      <div class="pref-card store-hidden portable-hidden">
        <div class="card-row">
          <div class="row-info">
            <span class="row-title" data-i18next="preferences.settings.openAtLogin"></span>
          </div>
          <label class="modern-switch" for="openAtLogin">
            <input type="checkbox" value="openAtLogin" id="openAtLogin">
            <span class="switch-track"></span>
          </label>
        </div>
      </div>

      <!-- Break Display Card -->
      <div class="pref-card">
        <div class="card-header">
          <span class="card-title" data-i18next="preferences.settings.showBreaksIn"></span>
        </div>
        <div class="segmented-control">
          <input type="radio" value="false" name="fullscreen" id="window">
          <label for="window" data-i18next="preferences.settings.window"></label>
          <input type="radio" value="true" name="fullscreen" id="fullscreen">
          <label for="fullscreen" data-i18next="preferences.settings.fullscreen"></label>
        </div>
        <div class="card-divider"></div>
        <div class="card-row">
          <div class="row-info">
            <span class="row-title" data-i18next="preferences.settings.allScreens"></span>
          </div>
          <label class="modern-switch" for="allScreens">
            <input type="checkbox" value="allScreens" id="allScreens">
            <span class="switch-track"></span>
          </label>
        </div>
        <div class="card-divider"></div>
        <div class="card-row">
          <div class="row-info">
            <span class="row-title" data-i18next="preferences.settings.showIdeas"></span>
          </div>
          <label class="modern-switch" for="showIdeas">
            <input type="checkbox" value="ideas" id="showIdeas">
            <span class="switch-track"></span>
          </label>
        </div>
      </div>

      <!-- Smart Behaviors Card -->
      <div class="pref-card">
        <div class="card-row">
          <div class="row-info">
            <span class="row-title" data-i18next="preferences.settings.monitorIdleTime"></span>
          </div>
          <label class="modern-switch" for="monitorIdleTime">
            <input type="checkbox" value="naturalBreaks" id="monitorIdleTime">
            <span class="switch-track"></span>
          </label>
        </div>
        <div class="card-divider"></div>
        <div class="card-row">
          <div class="row-info">
            <span class="row-title" data-i18next="preferences.settings.monitorDnd"></span>
          </div>
          <label class="modern-switch" for="monitorDnd">
            <input type="checkbox" class="negative" value="monitorDnd" id="monitorDnd">
            <span class="switch-track"></span>
          </label>
        </div>
      </div>

      <!-- Language Card -->
      <div class="pref-card">
        <div class="card-row flex-col-sm">
          <div class="row-info">
            <span class="row-title" data-i18next="preferences.settings.language"></span>
          </div>
          <div class="custom-select-wrapper">
            <select name="language" id="language" class="modern-select">
              <option value="ajp">اللهجة الأردنية</option>
              <option value="bg">Български</option>
              <option value="be">Беларуская мова</option>
              <option value="bn">বাংলা</option>
              <option value="ca">Català</option>
              <option value="cs">Čeština</option>
              <option value="da">Dansk</option>
              <option value="de">Deutsch</option>
              <option value="el">Ελληνικά</option>
              <option value="en">English</option>
              <option value="eo">Esperanto</option>
              <option value="es">Español</option>
              <option value="et">Eesti keel</option>
              <option value="fa">فارسی</option>
              <option value="fi">Suomi</option>
              <option value="fil">Wikang Filipino</option>
              <option value="fr">Français</option>
              <option value="gl">Galego</option>
              <option value="gu">ગુજરાતી</option>
              <option value="he">עברית</option>
              <option value="hi">हिन्दी</option>
              <option value="hu">Magyar</option>
              <option value="id">Bahasa Indonesia</option>
              <option value="it">Italiano</option>
              <option value="ja">日本語</option>
              <option value="ko">한국어</option>
              <option value="lt">Lietuvių</option>
              <option value="lv">Latviešu</option>
              <option value="mk">Македонски</option>
              <option value="nb-NO">Bokmål</option>
              <option value="nl">Nederlands</option>
              <option value="np">नेपाली</option>
              <option value="pl">Polski</option>
              <option value="pt">Português</option>
              <option value="pt-BR">Brasileiro</option>
              <option value="pu">ਪੰਜਾਬੀ</option>
              <option value="ro">Română</option>
              <option value="ru">Русский</option>
              <option value="si">සිංහල</option>
              <option value="sk">Slovenčina</option>
              <option value="sl">Slovenščina</option>
              <option value="sr">српски језик</option>
              <option value="sv">Svenska</option>
              <option value="ta">தமிழ்</option>
              <option value="th">ภาษาไทย</option>
              <option value="tr">Türkçe</option>
              <option value="uk">Українська</option>
              <option value="vi">Tiếng Việt</option>
              <option value="yi">ייִדיש</option>
              <option value="zh-CN">简体中文</option>
              <option value="zh-TW">正體中文</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Action Row -->
      <div class="action-row">
        <button type="button" class="btn-restore" data-i18next="preferences.settings.restoreDefaults"></button>
      </div>

    </div>

    <!-- ==================== TAB 2: SCHEDULE ==================== -->
    <div class="section-content schedule hidden">

      <!-- Mini Breaks Card -->
      <div class="pref-card" id="cardMiniBreaks">
        <div class="card-header">
          <div class="header-left">
            <span class="card-title" data-i18next="preferences.schedule.miniBreaks"></span>
            <p class="card-desc" data-i18next="preferences.schedule.miniBreaksInfo"></p>
          </div>
          <label class="modern-switch" for="enableMiniBreaks">
            <input type="checkbox" class="enabletype" value="microbreak" id="enableMiniBreaks">
            <span class="switch-track"></span>
          </label>
        </div>

        <div class="card-content-body">
          <div class="card-divider"></div>

          <!-- Mini Break Duration Slider -->
          <div class="slider-block">
            <div class="slider-meta">
              <label class="slider-label" data-same-width-label for="miniBreakFor" data-i18next="preferences.schedule.breakFor"></label>
              <output class="value-badge" data-unit="seconds"></output>
            </div>
            <input type="range" class="modern-range" min="10" max="600" step="10" list="tickmarksMiniBreakFor"
              name="microbreakDuration" data-divisor="1000" id="miniBreakFor">
            <datalist id="tickmarksMiniBreakFor">
              <option value="10"></option><option value="20"></option><option value="30"></option>
              <option value="40"></option><option value="50"></option><option value="60"></option>
              <option value="80"></option><option value="120"></option><option value="180"></option>
              <option value="240"></option><option value="300"></option><option value="360"></option>
              <option value="420"></option><option value="480"></option><option value="540"></option>
              <option value="600"></option>
            </datalist>
          </div>

          <!-- Mini Break Frequency Slider -->
          <div class="slider-block">
            <div class="slider-meta">
              <label class="slider-label" data-same-width-label for="miniBreakEvery" data-i18next="preferences.schedule.every"></label>
              <output class="value-badge" data-unit="minutes"></output>
            </div>
            <input type="range" class="modern-range" min="5" max="65" step="5" list="tickmarksMiniBreakEvery"
              name="microbreakInterval" data-divisor="60000" id="miniBreakEvery">
            <datalist id="tickmarksMiniBreakEvery">
              <option value="10"></option><option value="20"></option><option value="30"></option>
              <option value="40"></option><option value="50"></option><option value="60"></option>
            </datalist>
          </div>

          <div class="card-divider"></div>

          <div class="card-row">
            <div class="row-info">
              <span class="row-title" data-i18next="preferences.schedule.showNotificationBeforeMiniBreak"></span>
            </div>
            <label class="modern-switch" for="showNotificationBeforeMiniBreak">
              <input type="checkbox" value="microbreakNotification" id="showNotificationBeforeMiniBreak">
              <span class="switch-track"></span>
            </label>
          </div>

          <div class="card-divider"></div>

          <div class="card-row">
            <div class="row-info">
              <span class="row-title" data-i18next="preferences.schedule.enablePostponeMini"></span>
            </div>
            <label class="modern-switch" for="enablePostponeMini">
              <input type="checkbox" value="microbreakPostpone" id="enablePostponeMini">
              <span class="switch-track"></span>
            </label>
          </div>
        </div>
      </div>

      <!-- Long Breaks Card -->
      <div class="pref-card" id="cardLongBreaks">
        <div class="card-header">
          <div class="header-left">
            <span class="card-title" data-i18next="preferences.schedule.longBreaks"></span>
            <p class="card-desc" data-i18next="preferences.schedule.longBreaksInfo"></p>
          </div>
          <label class="modern-switch" for="enableLongBreaks">
            <input type="checkbox" class="enabletype" value="break" id="enableLongBreaks">
            <span class="switch-track"></span>
          </label>
        </div>

        <div class="card-content-body">
          <div class="card-divider"></div>

          <!-- Long Break Duration Slider -->
          <div class="slider-block">
            <div class="slider-meta">
              <label class="slider-label" data-same-width-label for="longBreakFor" data-i18next="preferences.schedule.breakFor"></label>
              <output class="value-badge" data-unit="minutes"></output>
            </div>
            <input type="range" class="modern-range" min="1" max="60" step="1" list="tickmarksLongBreakFor"
              name="breakDuration" data-divisor="60000" id="longBreakFor">
            <datalist id="tickmarksLongBreakFor">
              <option value="10"></option><option value="20"></option><option value="30"></option>
              <option value="40"></option><option value="50"></option>
            </datalist>
          </div>

          <!-- Long Break Frequency Slider -->
          <div class="slider-block">
            <div class="slider-meta">
              <label class="slider-label" data-same-width-label for="longBreakEvery" data-i18next="preferences.schedule.every"></label>
              <output class="value-badge" data-unit="minutes"></output>
            </div>
            <input type="range" class="modern-range" min="1" max="30" step="1" list="tickmarksLongBreakEvery"
              name="breakInterval" data-divisor="1" id="longBreakEvery">
            <datalist id="tickmarksLongBreakEvery">
              <option value="5"></option><option value="10"></option><option value="15"></option>
              <option value="20"></option><option value="25"></option><option value="30"></option>
            </datalist>
          </div>

          <div class="card-divider"></div>

          <div class="card-row">
            <div class="row-info">
              <span class="row-title" data-i18next="preferences.schedule.showNotificationBeforeLongBreak"></span>
            </div>
            <label class="modern-switch" for="showNotificationBeforeLongBreak">
              <input type="checkbox" value="breakNotification" id="showNotificationBeforeLongBreak">
              <span class="switch-track"></span>
            </label>
          </div>

          <div class="card-divider"></div>

          <div class="card-row">
            <div class="row-info">
              <span class="row-title" data-i18next="preferences.schedule.enablePostponeLong"></span>
            </div>
            <label class="modern-switch" for="enablePostponeLong">
              <input type="checkbox" value="breakPostpone" id="enablePostponeLong">
              <span class="switch-track"></span>
            </label>
          </div>
        </div>
      </div>

      <!-- Strict Mode Card -->
      <div class="pref-card" data-strict-mode>
        <div class="card-header">
          <div class="header-left">
            <span class="card-title text-warning" data-i18next="preferences.schedule.strictMode"></span>
            <p class="card-desc" data-i18next="preferences.schedule.strictModeInfo"></p>
          </div>
        </div>

        <div class="card-divider"></div>

        <div class="card-row">
          <div class="row-info">
            <span class="row-title" data-i18next="preferences.schedule.enableStrictMini"></span>
          </div>
          <label class="modern-switch" for="enableStrictMini">
            <input type="checkbox" value="microbreakStrictMode" id="enableStrictMini">
            <span class="switch-track"></span>
          </label>
        </div>

        <div class="card-divider"></div>

        <div class="card-row">
          <div class="row-info">
            <span class="row-title" data-i18next="preferences.schedule.enableStrictLong"></span>
          </div>
          <label class="modern-switch" for="enableStrictLong">
            <input type="checkbox" value="breakStrictMode" id="enableStrictLong">
            <span class="switch-track"></span>
          </label>
        </div>
      </div>

    </div>

    <!-- ==================== TAB: IDEAS & EXERCISES ==================== -->
    <div class="section-content ideas hidden">

      <!-- Toast Notification for Save -->
      <div id="ideasToast" class="save-toast hidden">
        <span data-i18next="preferences.ideas.savedToast"></span>
      </div>

      <!-- Mini Break Ideas Card -->
      <div class="pref-card" id="cardCustomMicrobreaks">
        <div class="card-header">
          <div class="header-left">
            <span class="card-title" data-i18next="preferences.ideas.microBreaksTitle"></span>
            <p class="card-desc" data-i18next="preferences.ideas.microBreaksDesc"></p>
          </div>
        </div>

        <div class="card-divider"></div>

        <div class="textarea-wrapper">
          <textarea id="microbreakIdeasText" class="modern-textarea" rows="7" placeholder="هر سطر یک جمله..."></textarea>
          <div class="textarea-footer">
            <span class="ideas-count" id="microbreakIdeasCount">۰ جمله فعال</span>
          </div>
        </div>
      </div>

      <!-- Long Break Ideas Card -->
      <div class="pref-card" id="cardCustomLongbreaks">
        <div class="card-header">
          <div class="header-left">
            <span class="card-title" data-i18next="preferences.ideas.longBreaksTitle"></span>
            <p class="card-desc" data-i18next="preferences.ideas.longBreaksDesc"></p>
          </div>
        </div>

        <div class="card-divider"></div>

        <div class="textarea-wrapper">
          <textarea id="longbreakIdeasText" class="modern-textarea" rows="8" placeholder="عنوان | متن تمرین..."></textarea>
          <div class="textarea-footer">
            <span class="ideas-count" id="longbreakIdeasCount">۰ تمرین فعال</span>
          </div>
        </div>
      </div>

      <!-- Actions Card -->
      <div class="ideas-actions-card">
        <button type="button" class="btn-primary-action" id="btnSaveIdeas">
          <svg class="btn-icon" viewBox="0 0 20 20" width="16" height="16" fill="currentColor">
            <path d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"/>
          </svg>
          <span data-i18next="preferences.ideas.saveBtn"></span>
        </button>

        <div class="ideas-actions-secondary">
          <button type="button" class="btn-secondary-action" id="btnRestoreIdeas">
            <svg class="btn-icon" viewBox="0 0 20 20" width="14" height="14" fill="currentColor">
              <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd"/>
            </svg>
            <span data-i18next="preferences.ideas.restoreBtn"></span>
          </button>
          <button type="button" class="btn-secondary-action" id="btnOpenIdeasTxt">
            <svg class="btn-icon" viewBox="0 0 20 20" width="14" height="14" fill="currentColor">
              <path d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z"/>
            </svg>
            <span data-i18next="preferences.ideas.openTxtBtn"></span>
          </button>
        </div>
      </div>

    </div>

    <!-- ==================== TAB 3: THEME ==================== -->
    <div class="section-content theme hidden">

      <!-- Appearance Card -->
      <div class="pref-card">
        <div class="card-header">
          <span class="card-title" data-i18next="preferences.theme.appearance"></span>
        </div>

        <!-- Circular Color Swatches Grid -->
        <div class="color-grid">
          <label class="color-item" for="greenClouds" title="Green Clouds">
            <input type="radio" value="#478484" name="mainColor" id="greenClouds">
            <span class="color-circle color-green-clouds"></span>
            <span class="color-name" data-i18next="preferences.theme.greenClouds"></span>
          </label>
          <label class="color-item" for="autumnBeBlessed" title="Autumn Be Blessed">
            <input type="radio" value="#633738" name="mainColor" id="autumnBeBlessed">
            <span class="color-circle color-autumn-be-blessed"></span>
            <span class="color-name" data-i18next="preferences.theme.autumnBeBlessed"></span>
          </label>
          <label class="color-item" for="snowWhite" title="Snow White">
            <input type="radio" value="#ffffff" name="mainColor" id="snowWhite">
            <span class="color-circle color-snow-white"></span>
            <span class="color-name" data-i18next="preferences.theme.snowWhite"></span>
          </label>
          <label class="color-item" for="graphiteCrystal" title="Graphite Crystal">
            <input type="radio" value="#1D1F21" name="mainColor" id="graphiteCrystal">
            <span class="color-circle color-graphite-crystal"></span>
            <span class="color-name" data-i18next="preferences.theme.graphiteCrystal"></span>
          </label>
          <label class="color-item" for="coffeeKisses" title="Coffee Kisses">
            <input type="radio" value="#A49898" name="mainColor" id="coffeeKisses">
            <span class="color-circle color-coffee-kisses"></span>
            <span class="color-name" data-i18next="preferences.theme.coffeeKisses"></span>
          </label>
          <label class="color-item" for="morningSwim" title="Morning Swim">
            <input type="radio" value="#567890" name="mainColor" id="morningSwim">
            <span class="color-circle color-morning-swim"></span>
            <span class="color-name" data-i18next="preferences.theme.morningSwim"></span>
          </label>
        </div>

        <div class="card-divider"></div>

        <div class="card-row">
          <div class="row-info">
            <span class="row-title" data-i18next="preferences.theme.transparentMode"></span>
          </div>
          <label class="modern-switch" for="enableTransparency">
            <input type="checkbox" value="transparentMode" id="enableTransparency">
            <span class="switch-track"></span>
          </label>
        </div>
      </div>

      <!-- Sounds Card -->
      <div class="pref-card" id="cardSounds">
        <div class="card-header">
          <span class="card-title" data-i18next="preferences.theme.sounds"></span>
          <label class="modern-switch" for="enableSounds">
            <input type="checkbox" class="negative" value="silentNotifications" id="enableSounds">
            <span class="switch-track"></span>
          </label>
        </div>

        <div class="card-content-body">
          <div class="card-divider"></div>

          <!-- Sound Tiles -->
          <div class="sound-list">
            <div class="sound-tile sounds">
              <input type="radio" value="crystal-glass" name="longBreakAudio" id="crystalGlass">
              <label class="sound-info" for="crystalGlass">
                <span class="radio-indicator"></span>
                <span class="sound-name" data-i18next="preferences.theme.crystalGlass"></span>
              </label>
              <button type="button" class="btn-sound-preview" data-sound="crystal-glass" title="Play preview" aria-label="Play sound">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                  <path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86A1 1 0 0 0 8 5.14z"/>
                </svg>
              </button>
            </div>

            <div class="sound-tile sounds">
              <input type="radio" value="wind-chime" name="longBreakAudio" id="windChime">
              <label class="sound-info" for="windChime">
                <span class="radio-indicator"></span>
                <span class="sound-name" data-i18next="preferences.theme.windChime"></span>
              </label>
              <button type="button" class="btn-sound-preview" data-sound="wind-chime" title="Play preview" aria-label="Play sound">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                  <path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86A1 1 0 0 0 8 5.14z"/>
                </svg>
              </button>
            </div>

            <div class="sound-tile sounds">
              <input type="radio" value="tic-toc" name="longBreakAudio" id="ticToc">
              <label class="sound-info" for="ticToc">
                <span class="radio-indicator"></span>
                <span class="sound-name" data-i18next="preferences.theme.ticToc"></span>
              </label>
              <button type="button" class="btn-sound-preview" data-sound="tic-toc" title="Play preview" aria-label="Play sound">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                  <path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86A1 1 0 0 0 8 5.14z"/>
                </svg>
              </button>
            </div>

            <div class="sound-tile sounds">
              <input type="radio" value="reverie" name="longBreakAudio" id="reverie">
              <label class="sound-info" for="reverie">
                <span class="radio-indicator"></span>
                <span class="sound-name" data-i18next="preferences.theme.reverie"></span>
              </label>
              <button type="button" class="btn-sound-preview" data-sound="reverie" title="Play preview" aria-label="Play sound">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                  <path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86A1 1 0 0 0 8 5.14z"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Tray Icon Card -->
      <div class="pref-card">
        <div class="card-header">
          <span class="card-title" data-i18next="preferences.theme.trayIcon"></span>
        </div>

        <div class="card-row flex-col-sm">
          <div class="row-info">
            <span class="row-title" data-i18next="preferences.theme.trayIconStyleLabel"></span>
          </div>
          <div class="custom-select-wrapper">
            <select name="trayIconStyle" id="trayIconStyle" class="modern-select">
              <option value="default" data-i18next="preferences.theme.trayIconStyleDefault"></option>
              <option value="time" data-i18next="preferences.theme.trayIconStyleTime"></option>
              <option value="progress" data-i18next="preferences.theme.trayIconStyleProgress"></option>
            </select>
          </div>
        </div>

        <div class="card-divider"></div>

        <div class="segmented-control">
          <input type="radio" value="false" name="useMonochromeTrayIcon" id="colour">
          <label for="colour" data-i18next="preferences.theme.colour"></label>
          <input type="radio" value="true" name="useMonochromeTrayIcon" id="monochrome">
          <label for="monochrome" data-i18next="preferences.theme.monochrome"></label>
        </div>
      </div>

    </div>

    <!-- ==================== TAB 4: ABOUT ==================== -->
    <div class="section-content about hidden">

      <!-- Hero Card -->
      <div class="pref-card about-hero-card">
        <div class="hero-logo-row">
          <img src="images/stretchly.svg" alt="Stretchly logo" class="hero-logo">
          <div class="hero-titles">
            <h1 class="hero-appname">Stretchly</h1>
            <span class="hero-tagline" data-i18next="preferences.about.tagline"></span>
          </div>
        </div>

        <div class="card-divider"></div>

        <!-- Version & Update Row -->
        <div class="card-row">
          <div class="row-info">
            <span class="row-title">
              <span data-i18next="preferences.about.version"></span>
              <span class="version-badge version"></span>
            </span>
          </div>
          <div class="update-check-wrapper">
            <label class="modern-switch" for="checkNewVersion">
              <input type="checkbox" value="checkNewVersion" id="checkNewVersion">
              <span class="switch-track"></span>
            </label>
          </div>
        </div>

        <div class="latest-version-info">
          (<span data-i18next="preferences.about.latestVersion"></span>: <span class="latestVersion"></span>)
        </div>
      </div>

      <!-- Links & Diagnostics Card -->
      <div class="pref-card">
        <div class="card-row">
          <div class="row-info flex-center">
            <img src="images/preferences/home.svg" class="home-icon" alt="Home">
            <span data-i18next="preferences.about.learnMore"></span>
          </div>
          <a class="modern-link-btn" data-i18next="preferences.about.ourWebsite" href="https://hovancik.net/stretchly/"></a>
        </div>

        <div class="card-divider"></div>

        <div class="credits-row">
          <span>
            <span data-i18next="preferences.about.developedBy"></span>
            <a data-i18next="preferences.about.janH" href="https://hovancik.net/"></a>
          </span>
          <span class="credits-dot">•</span>
          <span>
            <span data-i18next="preferences.about.designedBy"></span>
            (<a href="http://www.colinshanley.com/">Colin Shanley</a>)
          </span>
        </div>
      </div>

      <!-- Diagnostics Panel (Ctrl+D) -->
      <div class="debug">
        <div class="hidden debug-panel">
          <p id="to-copy">
            breakPlanner: {reference: <span id="reference"></span>,
            timeleft: <span id="timeleft"></span>,
            breakNumber: <span id="breakNumber"></span>,
            postponesNumber: <span id="postponesNumber"></span>,
            Do Not Disturb: <span id="donotdisturb"></span>}
            <br />
            <span data-preferences-file>
              settingsFile: <a href="" class="file" id="settingsfile"></a>
              <br />
              imagesFolder: <a href="" class="file" id="imagesfolder"></a>
              <br />
            </span>
            logsFile: <a href="" class="file" id="logsfile"></a>
            <br />Node.js: <span id="node"></span>,
            Chromium: <span id="chrome"></span>,
            Electron: <span id="electron"></span>
            <br />OS: <span id="platform"></span><span class="linux-hidden darwin-hidden">,
              Windows Store: <span id="windowsStore"></span>,
              Windows Portable: <span id="windowsPortable"></span></span>
          </p>
          <div class="debug-actions">
            <button class="btn-debug-copy" type="button">Copy to clipboard</button>
          </div>
        </div>
      </div>

    </div>

  </main>
</body>
<script type="module" src="./preferences-renderer.js"></script>

</html>
